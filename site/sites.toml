# Booking sites served by this calrs instance (fork feature, see FORK.md).
# Which meeting types each site offers is chosen in the event type form
# ("Booking sites"), by domain.
# Deployed to <data_dir>/sites.toml with skins/ beside it. Restart calrs after
# a change. A request on a host not listed here behaves like stock calrs.

# Where the source of this modified calrs is published (AGPL-3.0 section 13).
# Linked from the footer of every booking site.
source_url = "https://github.com/tomelliot/calrs"

[sites."calendar.tomelliot.net"]
# Former host: redirects here, and its bookings moved here.
aliases = ["book.tomelliot.net"]
skin = "tomelliot"
title = "Tom Elliot"
# calrs username whose meeting types the site offers.
user = "tom"
link = "https://www.tomelliot.net"
# Guest emails: a Fastmail sending identity on the same SMTP login. They
# show the host's name; set from_name to show another.
from_email = "tom@tomelliot.net"
reply_to = "tom@tomelliot.net"

[sites."calendar.coscope.ai"]
# Former host: redirects here, and its bookings moved here.
aliases = ["book.coscope.ai"]
skin = "coscope"
title = "coscope"
user = "tom"
link = "https://coscope.ai"
from_email = "tom@coscope.ai"
reply_to = "tom@coscope.ai"
